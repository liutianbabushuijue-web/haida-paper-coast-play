name: Deploy coastal experience
on:
  push:
    branches: [main]
    paths: [site-v11.1.zip, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract published assets
        run: |
          unzip -q site-v11.1.zip -d site
          test -f site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: coast-pages-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: coast-pages-${{ github.run_attempt }}
        run: |
          for delay in 1 2 4 8 12 16 20; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq .total_count) || count=0
            if [ "$count" = 1 ]; then exit 0; fi
            sleep "$delay"
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: publish
        with:
          artifact_name: coast-pages-${{ github.run_attempt }}
